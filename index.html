<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Virtual Walk — 手機虛擬散步原型</title>
<style>
  html,body{margin:0;height:100%;overflow:hidden;background:#111;font-family:system-ui,-apple-system,"Noto Sans TC",sans-serif}
  #hud{position:fixed;z-index:10;left:12px;right:12px;top:12px;color:white;text-shadow:0 1px 4px #000;pointer-events:none}
  #title{font-size:18px;font-weight:700}
  #status{font-size:14px;margin-top:4px}
  #info{font-size:13px;margin-top:4px;opacity:.9}
  #start{position:fixed;z-index:20;left:50%;top:50%;transform:translate(-50%,-50%);
         padding:14px 22px;border:0;border-radius:12px;font-size:17px;background:white;color:#111}
  #hint{position:fixed;z-index:10;bottom:12px;left:12px;right:12px;text-align:center;color:white;
        font-size:13px;text-shadow:0 1px 4px #000;pointer-events:none}
</style>
</head>
<body>
<div id="hud">
  <div id="title">🌲 Virtual Walk · Forest</div>
  <div id="status">尚未開始</div>
  <div id="info">步頻：0 步/分　速度：0</div>
</div>
<button id="start">開始虛擬散步</button>
<div id="hint">拿手機直立放在胸前或手上，原地自然踏步。第一次請允許「動作與方向」權限。</div>

<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>
<script>
const statusEl=document.getElementById('status');
const infoEl=document.getElementById('info');
const startBtn=document.getElementById('start');

let scene,camera,renderer,clock;
let moving=false, lastStep=0, steps=0, stepTimes=[];
let speed=0, targetSpeed=0, distance=0;
let motionReady=false;

// ---------- Three.js ----------
function init3D(){
  scene=new THREE.Scene();
  scene.background=new THREE.Color(0x9fd0e8);
  scene.fog=new THREE.Fog(0x9fd0e8,35,180);

  camera=new THREE.PerspectiveCamera(70,innerWidth/innerHeight,.1,300);
  camera.position.set(0,1.65,6);

  renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:"high-performance"});
  renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));
  renderer.setSize(innerWidth,innerHeight);
  document.body.appendChild(renderer.domElement);

  const hemi=new THREE.HemisphereLight(0xffffff,0x557755,2.0);
  scene.add(hemi);

  // Ground
  const groundMat=new THREE.MeshLambertMaterial({color:0x6d9b58});
  const ground=new THREE.Mesh(new THREE.PlaneGeometry(240,900),groundMat);
  ground.rotation.x=-Math.PI/2;
  ground.position.z=-420;
  scene.add(ground);

  // Path
  const pathMat=new THREE.MeshLambertMaterial({color:0xc6ad82});
  const path=new THREE.Mesh(new THREE.PlaneGeometry(5,900),pathMat);
  path.rotation.x=-Math.PI/2;
  path.position.y=.012;
  path.position.z=-420;
  scene.add(path);

  // Trees along both sides
  const treeMat=new THREE.MeshLambertMaterial({color:0x2f6b3b});
  const trunkMat=new THREE.MeshLambertMaterial({color:0x6b4930});
  for(let z=-8; z>-850; z-=7){
    addTree(-5.5 + (Math.random()-.5)*2, z, .75+Math.random()*1.2);
    addTree( 5.5 + (Math.random()-.5)*2, z, .75+Math.random()*1.2);
    if(Math.random()>.45) addTree(-8+Math.random()*2,z-2,0.6+Math.random());
    if(Math.random()>.45) addTree( 8-Math.random()*2,z-2,0.6+Math.random());
  }

  // Village ahead
  for(let z=-130;z>-190;z-=10){
    addHouse(-9,z,Math.random()*.4);
    addHouse(9,z,Math.random()*.4);
  }

  // Mountain silhouettes
  const mountainMat=new THREE.MeshLambertMaterial({color:0x567c73});
  for(let i=0;i<8;i++){
    const m=new THREE.Mesh(new THREE.ConeGeometry(18+Math.random()*15,35+Math.random()*30,6),mountainMat);
    m.position.set((i%2?1:-1)*(25+Math.random()*20),15,-100-i*55);
    scene.add(m);
  }

  // Castle
  addCastle(0,-270);

  clock=new THREE.Clock();
  animate();
}

function addTree(x,z,s){
  const g=new THREE.Group();
  const trunk=new THREE.Mesh(new THREE.CylinderGeometry(.18*s,.24*s,2.2*s,7),new THREE.MeshLambertMaterial({color:0x68472e}));
  trunk.position.y=1.1*s;
  g.add(trunk);
  for(let i=0;i<3;i++){
    const crown=new THREE.Mesh(new THREE.ConeGeometry((1.4-i*.25)*s,2.5*s,8),
      new THREE.MeshLambertMaterial({color:i===2?0x3e7a43:0x2d6938}));
    crown.position.y=(2.0+i*.8)*s;
    g.add(crown);
  }
  g.position.set(x,0,z);
  scene.add(g);
}

function addHouse(x,z,r){
  const g=new THREE.Group();
  const body=new THREE.Mesh(new THREE.BoxGeometry(4,2.6,4),
    new THREE.MeshLambertMaterial({color:0xe1d1ad}));
  body.position.y=1.3; g.add(body);
  const roof=new THREE.Mesh(new THREE.ConeGeometry(3.2,1.8,4),
    new THREE.MeshLambertMaterial({color:0x8a4f42}));
  roof.rotation.y=Math.PI/4; roof.position.y=3.5; g.add(roof);
  g.position.set(x,0,z); g.rotation.y=r; scene.add(g);
}

function addCastle(x,z){
  const g=new THREE.Group();
  const mat=new THREE.MeshLambertMaterial({color:0x9b9a9b});
  const wall=new THREE.Mesh(new THREE.BoxGeometry(16,7,7),mat);
  wall.position.y=3.5;g.add(wall);
  for(const x2 of [-7,7]){
    const t=new THREE.Mesh(new THREE.CylinderGeometry(1.8,1.8,11,8),mat);
    t.position.set(x2,5.5,0);g.add(t);
  }
  const roofMat=new THREE.MeshLambertMaterial({color:0x5e5965});
  for(const x2 of [-7,7]){
    const roof=new THREE.Mesh(new THREE.ConeGeometry(2.4,3,8),roofMat);
    roof.position.set(x2,12,0);g.add(roof);
  }
  g.position.set(x,0,z);scene.add(g);
}

// ---------- Step detection ----------
function detectStepFromMotion(e){
  const a=e.accelerationIncludingGravity;
  if(!a) return;
  const mag=Math.sqrt((a.x||0)**2+(a.y||0)**2+(a.z||0)**2);
  const now=performance.now();

  // A deliberately simple prototype detector: peaks above threshold,
  // with a refractory period to avoid double-counting.
  if(mag>13.0 && now-lastStep>280){
    lastStep=now;
    registerStep(now);
  }
}

function registerStep(now){
  steps++;
  stepTimes.push(now);
  stepTimes=stepTimes.filter(t=>now-t<5000);

  if(stepTimes.length>=2){
    const intervals=[];
    for(let i=1;i<stepTimes.length;i++) intervals.push(stepTimes[i]-stepTimes[i-1]);
    const avg=intervals.reduce((a,b)=>a+b,0)/intervals.length;
    const spm=Math.max(0,Math.min(160,60000/avg));
    targetSpeed=Math.max(0,Math.min(5,spm/30)); // prototype mapping
  }
  statusEl.textContent="正在散步";
}

function animate(){
  requestAnimationFrame(animate);
  const dt=Math.min(clock.getDelta(),.05);

  // Decay when steps stop
  if(performance.now()-lastStep>1200){
    targetSpeed=0;
    statusEl.textContent=motionReady?"等下一步…":"尚未開始";
  }
  speed += (targetSpeed-speed)*Math.min(1,dt*5);
  distance += speed*dt;

  // Move world toward camera = walking forward
  scene.traverse(o=>{
    if(o.isMesh && o!==renderer.domElement){
      // Don't move the camera; move environment
    }
  });

  // Efficient prototype: move all world objects except lights/camera.
  for(const o of scene.children){
    if(o===camera || o.type==="HemisphereLight") continue;
    o.position.z += speed*dt;
    if(o.position.z>20) o.position.z-=850;
  }

  infoEl.textContent=`步頻：${Math.round(currentSPM())} 步/分　速度：${speed.toFixed(1)}　距離：${distance.toFixed(0)} m`;
  renderer.render(scene,camera);
}
function currentSPM(){
  if(stepTimes.length<2)return 0;
  const now=performance.now();
  const arr=stepTimes.filter(t=>now-t<5000);
  if(arr.length<2)return 0;
  const ints=[];
  for(let i=1;i<arr.length;i++)ints.push(arr[i]-arr[i-1]);
  return 60000/(ints.reduce((a,b)=>a+b,0)/ints.length);
}

async function start(){
  startBtn.style.display="none";
  if(typeof DeviceMotionEvent!=="undefined" &&
     typeof DeviceMotionEvent.requestPermission==="function"){
    try{
      const p=await DeviceMotionEvent.requestPermission();
      if(p!=="granted") throw new Error("permission denied");
    }catch(err){
      statusEl.textContent="感測器權限未開啟；目前只能看到 3D 世界";
    }
  }
  window.addEventListener('devicemotion',detectStepFromMotion,{passive:true});
  motionReady=true;
  statusEl.textContent="請開始原地踏步";
}

window.addEventListener('resize',()=>{
  if(!camera||!renderer)return;
  camera.aspect=innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight);
});
startBtn.addEventListener('click',start);
init3D();
</script>
</body>
</html>
