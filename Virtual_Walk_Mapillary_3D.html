<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#07131d">
<title>Virtual Walk 3.0 — Mapillary 3D Edition</title>
<link rel="stylesheet" href="https://unpkg.com/mapillary-js@4.1.2/dist/mapillary.css">
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#050a12;color:#fff;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Noto Sans TC",sans-serif}
#mapillary{position:fixed;inset:0;z-index:0}
#fx{position:fixed;inset:0;z-index:5;pointer-events:none}
#ui{position:fixed;inset:0;z-index:10;pointer-events:none}
.card{background:rgba(5,12,20,.52);border:1px solid rgba(255,255,255,.14);backdrop-filter:blur(12px);box-shadow:0 10px 35px rgba(0,0,0,.28);border-radius:18px;padding:10px 13px}
.top{position:absolute;top:max(12px,env(safe-area-inset-top));left:12px;right:12px;display:flex;justify-content:space-between;gap:10px}
.brand{font-weight:900;letter-spacing:.4px}.sub{font-size:11px;opacity:.72;margin-top:2px}
.stats{display:flex;gap:9px}.stat{text-align:center;min-width:52px}.num{font-size:18px;font-weight:900}.lab{font-size:9px;opacity:.65}
#quest{position:absolute;left:50%;top:15%;transform:translateX(-50%);padding:8px 14px;border-radius:999px;background:rgba(5,10,18,.55);border:1px solid rgba(255,255,255,.16);backdrop-filter:blur(10px);font-weight:800;font-size:12px;opacity:0;transition:.3s}
#quest.show{opacity:1}
#cross{position:absolute;left:50%;top:50%;width:24px;height:24px;transform:translate(-50%,-50%);opacity:.9}
#cross:before,#cross:after{content:"";position:absolute;background:#fff;box-shadow:0 0 8px #fff}
#cross:before{width:2px;height:24px;left:11px;top:0}#cross:after{height:2px;width:24px;left:0;top:11px}
#coords{position:absolute;left:12px;bottom:92px;font-size:10px;opacity:.72}
.bottom{position:absolute;bottom:max(14px,env(safe-area-inset-bottom));left:12px;right:12px;display:flex;justify-content:center;gap:8px;flex-wrap:wrap;pointer-events:auto}
button,input{font:inherit}
button{position:relative;z-index:40;touch-action:manipulation;pointer-events:auto;border:1px solid rgba(255,255,255,.16);color:#fff;background:rgba(8,20,30,.78);backdrop-filter:blur(12px);padding:11px 15px;border-radius:999px;font-weight:850;font-size:12px;box-shadow:0 8px 25px rgba(0,0,0,.25);cursor:pointer}
button.primary{background:linear-gradient(135deg,rgba(55,190,255,.96),rgba(112,82,255,.96))}
button.gold{background:linear-gradient(135deg,rgba(255,175,62,.96),rgba(255,82,130,.96))}
button:active{transform:scale(.97)}
#start{position:fixed;inset:0;z-index:50;display:grid;place-items:center;background:radial-gradient(circle at 50% 40%,rgba(54,128,190,.28),rgba(3,8,15,.94));pointer-events:auto;transition:.5s}
#start.hide{opacity:0;pointer-events:none}
.panel{width:min(92vw,470px);padding:24px;border-radius:28px;text-align:center;background:rgba(4,13,22,.76);border:1px solid rgba(255,255,255,.14);backdrop-filter:blur(18px);box-shadow:0 25px 80px rgba(0,0,0,.5)}
.panel h1{margin:0;font-size:31px}.panel p{opacity:.76;line-height:1.6;font-size:13px}
.field{display:flex;gap:7px;margin:10px 0}.field input{min-width:0;flex:1;border-radius:13px;border:1px solid rgba(255,255,255,.14);background:rgba(255,255,255,.06);color:#fff;padding:11px}
.small{font-size:10px;opacity:.58;line-height:1.5}
#loading{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);padding:13px 17px;border-radius:999px;background:rgba(0,0,0,.62);display:none;z-index:20}
#loading.show{display:block}
.badge{display:inline-block;padding:3px 7px;border-radius:999px;background:rgba(255,255,255,.08);margin:2px}
</style>
</head>
<body>
<div id="mapillary"></div>
<canvas id="fx"></canvas>

<div id="ui">
  <div class="top">
    <div class="card">
      <div class="brand">🌌 Virtual Walk 3.0</div>
      <div class="sub" id="phase">Mapillary × Three.js · 真實街景冒險</div>
    </div>
    <div class="card stats">
      <div class="stat"><div class="num" id="steps">0</div><div class="lab">步數</div></div>
      <div class="stat"><div class="num" id="spm">0</div><div class="lab">SPM</div></div>
      <div class="stat"><div class="num" id="dist">0.00</div><div class="lab">km</div></div>
      <div class="stat"><div class="num" id="xp">0</div><div class="lab">XP</div></div>
    </div>
  </div>
  <div id="quest">🎯 任務：探索附近的街道</div>
  <div id="cross"></div>
  <div id="coords">等待街景…</div>
  <div id="loading">🌐 正在尋找附近 Mapillary 街景…</div>
  <div class="bottom">
    <button class="primary" id="walkBtn">🚶 前進一步</button>
    <button id="autoBtn">▶ 自動行走</button>
    <button id="turnL">↶ 左轉</button>
    <button id="turnR">↷ 右轉</button>
    <button class="gold" id="newBtn">📍 換地點</button>
    <button id="motionBtn">📱 感測器</button>
  </div>
</div>

<div id="start">
  <div class="panel">
    <h1>🌍 Virtual Walk 3.0</h1>
    <p>免費 Mapillary 街景 + Three.js 遊戲特效。<br>輸入 Mapillary Access Token，就能把真實街道變成探索遊戲。</p>
    <div class="field"><input id="token" placeholder="貼上 Mapillary Access Token（MLY|...）" autocomplete="off"><button class="primary" id="loadBtn">載入</button></div>
    <div class="field"><input id="lat" value="25.03396" placeholder="緯度"><input id="lng" value="121.56447" placeholder="經度"></div>
    <div class="small">
      目前預設：台北 101 附近。<br>
      <span class="badge">W / ↑ 前進</span><span class="badge">A / ← 左轉</span><span class="badge">D / → 右轉</span><br>
      Mapillary 是免費平台，但你的應用仍需遵守其圖片授權與 attribution 規則。
    </div>
  </div>
</div>

<script src="https://unpkg.com/mapillary-js@4.1.2/dist/mapillary.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>
<script>
"use strict";
const $=id=>document.getElementById(id);
let viewer=null, token="", currentImage=null, currentPosition=null;
let steps=0, distance=0, xp=0, stepTimes=[], autoTimer=null, autoWalking=false;
let lastStep=0, lastBearing=0;

function toast(t){
  $("quest").textContent=t; $("quest").classList.add("show");
  clearTimeout(toast.t); toast.t=setTimeout(()=>$("quest").classList.remove("show"),2800);
}

function saveToken(v){try{localStorage.setItem("vw_mapillary_token",v)}catch(e){}}
function savedToken(){try{return localStorage.getItem("vw_mapillary_token")||""}catch(e){return ""}}
$("token").value=savedToken();

function hav(a,b){
  const R=6371, p=Math.PI/180, dLat=(b.lat-a.lat)*p, dLon=(b.lng-a.lng)*p;
  const x=Math.sin(dLat/2)**2+Math.cos(a.lat*p)*Math.cos(b.lat*p)*Math.sin(dLon/2)**2;
  return 2*R*Math.asin(Math.sqrt(x));
}
function angDiff(a,b){return ((a-b+540)%360)-180}

async function findImage(lat,lng){
  const d=.0022;
  const bbox=[lng-d,lat-d,lng+d,lat+d].join(",");
  const url="https://graph.mapillary.com/images?access_token="+encodeURIComponent(token)+
    "&fields=id,computed_geometry,computed_compass_angle,sequence,camera_type,thumb_1024_url&bbox="+bbox+"&limit=100";
  const r=await fetch(url);
  if(!r.ok) throw new Error("Mapillary API "+r.status);
  const j=await r.json();
  if(!j.data?.length) throw new Error("附近沒有可用街景");
  let best=j.data[0], bd=Infinity;
  for(const x of j.data){
    const c=x.computed_geometry?.coordinates;
    if(!c) continue;
    const q=hav({lat,lng},{lat:c[1],lng:c[0]});
    if(q<bd){bd=q;best=x}
  }
  return best;
}

async function startViewer(imageId){
  if(viewer){try{viewer.remove()}catch(e){} viewer=null}
  viewer=new mapillary.Viewer({
    accessToken:token,
    container:"mapillary",
    imageId:imageId,
    component:{
      cover:false,
      direction:true,
      keyboard:false,
      image:true,
      spatial:true,
      sequence:false
    }
  });
  viewer.on("load",()=>{$("loading").classList.remove("show")});
  viewer.on("image",e=>{
    currentImage=e.image;
    const p=currentImage.lngLat;
    currentPosition={lat:p.lat,lng:p.lng};
    const b=currentImage.compassAngle || currentImage.computedCompassAngle || lastBearing || 0;
    lastBearing=b;
    $("coords").textContent=`📍 ${p.lat.toFixed(5)}, ${p.lng.toFixed(5)}  ·  ${Math.round(b)}°`;
  });
  viewer.on("position",async()=>{
    try{
      const p=await viewer.getPosition();
      currentPosition={lat:p.lngLat.lat,lng:p.lngLat.lng};
      $("coords").textContent=`📍 ${p.lngLat.lat.toFixed(5)}, ${p.lngLat.lng.toFixed(5)}`;
    }catch(e){}
  });
  viewer.on("bearing",e=>{if(Number.isFinite(e.bearing)) lastBearing=e.bearing});
  await viewer.moveTo(imageId);
}

async function loadAt(lat,lng){
  $("loading").classList.add("show");
  try{
    const img=await findImage(lat,lng);
    await startViewer(img.id);
    toast("🎮 街景載入完成！開始探索吧");
  }catch(e){
    $("loading").classList.remove("show");
    toast("⚠️ "+(e.message||"載入失敗"));
  }
}

async function step(){
  if(!viewer || !currentImage || performance.now()-lastStep<350) return;
  lastStep=performance.now();
  try{
    const pos=currentImage.lngLat;
    const b=(currentImage.compassAngle || currentImage.computedCompassAngle || lastBearing || 0)*Math.PI/180;
    // Move slightly forward in the current viewing direction and ask the API for the nearest image.
    const meters=22;
    const lat=pos.lat+(meters*Math.cos(b))/111320;
    const lng=pos.lng+(meters*Math.sin(b))/(111320*Math.cos(pos.lat*Math.PI/180));
    const next=await findImage(lat,lng);
    await viewer.moveTo(next.id);
    const np=next.computed_geometry?.coordinates;
    const old={lat:pos.lat,lng:pos.lng};
    const now=np?{lat:np[1],lng:np[0]}: {lat,lng};
    const km=hav(old,now);
    if(km>.002 && km<.25) distance+=km;
    steps++; xp+=10; stepTimes.push(performance.now());
    stepTimes=stepTimes.filter(t=>performance.now()-t<60000);
    $("steps").textContent=steps.toLocaleString();
    $("dist").textContent=distance.toFixed(2);
    $("spm").textContent=stepTimes.length;
    $("xp").textContent=xp;
    toast(pickQuest());
    pulse();
  }catch(e){toast("⚠️ 前方沒有找到連續街景，換個方向試試")}
}

function pickQuest(){
  const q=[
    "🎯 發現新的街道！+10 XP",
    "✨ 探索進度 +10 XP",
    "🗺️ 繼續尋找下一個路口",
    "🏆 任務進度：向前探索",
    "🌟 新區域已發現"
  ];
  return q[Math.floor(Math.random()*q.length)];
}
async function turn(dir){
  if(!viewer || !currentImage) return;
  const p=currentImage.lngLat;
  const bearing=(currentImage.compassAngle || currentImage.computedCompassAngle || lastBearing || 0);
  const target=(bearing+(dir<0?-90:90)+360)%360;
  const rad=target*Math.PI/180, meters=28;
  const lat=p.lat+(meters*Math.cos(rad))/111320;
  const lng=p.lng+(meters*Math.sin(rad))/(111320*Math.cos(p.lat*Math.PI/180));
  $("loading").classList.add("show");
  try{
    const next=await findImage(lat,lng);
    await viewer.moveTo(next.id);
    xp+=5; $("xp").textContent=xp;
    toast(dir<0?"↶ 左轉成功 · +5 XP":"↷ 右轉成功 · +5 XP");
  }catch(e){toast("⚠️ 這個方向附近沒有找到街景")}
  $("loading").classList.remove("show");
}

$("walkBtn").onclick=step;
$("turnL").onclick=()=>turn(-1);
$("turnR").onclick=()=>turn(1);

$("autoBtn").onclick=()=>{
  autoWalking=!autoWalking;
  $("autoBtn").textContent=autoWalking?"⏸ 停止自動行走":"▶ 自動行走";
  clearInterval(autoTimer);
  if(autoWalking) autoTimer=setInterval(step,1500);
};

$("newBtn").onclick=()=>{
  const lat=parseFloat(prompt("輸入緯度", currentPosition?.lat||25.03396));
  const lng=parseFloat(prompt("輸入經度", currentPosition?.lng||121.56447));
  if(Number.isFinite(lat)&&Number.isFinite(lng)) loadAt(lat,lng);
};

$("loadBtn").onclick=()=>{
  const v=$("token").value.trim();
  const lat=parseFloat($("lat").value), lng=parseFloat($("lng").value);
  if(!v){toast("請先貼上 Mapillary Access Token");return}
  if(!Number.isFinite(lat)||!Number.isFinite(lng)){toast("請輸入正確座標");return}
  token=v;saveToken(v);
  $("start").classList.add("hide");
  loadAt(lat,lng);
};

window.addEventListener("keydown",e=>{
  if(e.target.tagName==="INPUT")return;
  if(e.key==="ArrowUp"||e.key.toLowerCase()==="w")step();
  if(e.key==="ArrowLeft"||e.key.toLowerCase()==="a")turn(-1);
  if(e.key==="ArrowRight"||e.key.toLowerCase()==="d")turn(1);
});

async function enableMotion(){
  try{
    if(typeof DeviceOrientationEvent!=="undefined" && typeof DeviceOrientationEvent.requestPermission==="function"){
      const p=await DeviceOrientationEvent.requestPermission(); if(p!=="granted") throw 0;
    }
    window.addEventListener("deviceorientation",e=>{
      if(e.alpha==null||!viewer)return;
      // Gentle heading hint; MapillaryJS remains responsible for camera rendering.
      lastBearing=(360-e.alpha)%360;
    });
    $("motionBtn").textContent="📱 感測器已開";
    toast("📱 感測器已啟用");
  }catch(e){toast("⚠️ 此瀏覽器未授權方向感測器")}
}
$("motionBtn").onclick=enableMotion;

// ===== Three.js game FX overlay =====
const fx=$("fx"), scene=new THREE.Scene();
const cam=new THREE.OrthographicCamera(-1,1,1,-1,0,10);
cam.position.z=5;
const ren=new THREE.WebGLRenderer({canvas:fx,alpha:true,antialias:true});
ren.setPixelRatio(Math.min(devicePixelRatio,1.7));ren.setSize(innerWidth,innerHeight);
const geo=new THREE.BufferGeometry(), pos=[], vel=[];
for(let i=0;i<120;i++){pos.push((Math.random()*2-1)*innerWidth/2,(Math.random()*2-1)*innerHeight/2,0);vel.push((Math.random()-.5)*.3,Math.random()*.8+.15)}
geo.setAttribute("position",new THREE.Float32BufferAttribute(pos,3));
const pm=new THREE.PointsMaterial({color:0x8ee7ff,size:3,transparent:true,opacity:.45,blending:THREE.AdditiveBlending});
const pts=new THREE.Points(geo,pm);scene.add(pts);
let pulses=[];
function pulse(){
  const g=new THREE.RingGeometry(12,15,40);
  const m=new THREE.MeshBasicMaterial({color:0x62e6ff,transparent:true,opacity:.85,side:THREE.DoubleSide});
  const x=new THREE.Mesh(g,m);x.position.set(0,0,1);x.scale.set(.2,.2,1);scene.add(x);pulses.push(x);
}
function resizeFX(){ren.setSize(innerWidth,innerHeight);ren.setPixelRatio(Math.min(devicePixelRatio,1.7))}
addEventListener("resize",resizeFX);
let et=0;
function animateFX(){
  requestAnimationFrame(animateFX); et+=.016;
  const a=geo.attributes.position.array;
  for(let i=0;i<vel.length;i++){a[i*3]+=Math.sin(et+i)*.04;a[i*3+1]+=vel[i];if(a[i*3+1]>innerHeight/2)a[i*3+1]=-innerHeight/2}
  geo.attributes.position.needsUpdate=true;
  for(let i=pulses.length-1;i>=0;i--){let p=pulses[i];p.scale.x+=.035;p.scale.y+=.035;p.material.opacity*=.94;if(p.material.opacity<.03){scene.remove(p);pulses.splice(i,1)}}
  ren.render(scene,cam);
}
animateFX();

window.addEventListener("error",e=>{
  if(e.message) console.warn("Virtual Walk:",e.message);
});
</script>
</body>
</html>
