<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport"
      content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">

<title>Virtual Walk · Fantasy World</title>

<style>
html,body{
  margin:0;
  height:100%;
  overflow:hidden;
  background:#080b18;
  font-family:system-ui,-apple-system,"Noto Sans TC",sans-serif;
}

canvas{
  display:block;
}

#hud{

}

}

  top:50%;

  border-radius:18px;

  font-size:18px;
  font-weight:700;

  opacity:.85;

  position:fixed;
  inset:0;
  z-index:10;

  background:
    radial-gradient(

</style>
</head>

<body>

<div id="hud">
  <div id="title">🌲 Virtual Walk · Fantasy World</div>
  <div id="status">尚未開始</div>
  <div id="info">步頻：0 步/分　速度：0　距離：0 m</div>
  <div id="worldName">世界正在等待你的腳步…</div>
</div>

<button id="start">🚶 開始虛擬散步</button>

<button id="simulate">👟 模擬走路</button>

<div id="fade"></div>

<div id="hint">
  拿手機自然散步或原地踏步。第一次使用手機時請允許「動作與方向」權限。
</div>

<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>

<script>

////////////////////////////////////////////////////////////
// 基本狀態
////////////////////////////////////////////////////////////

let scene;
let camera;
let renderer;
let clock;

let moving = false;
let motionReady = false;

let lastStep = 0;
let steps = 0;
let stepTimes = [];

let speed = 0;
let targetSpeed = 0;
let distance = 0;

let worldSeed = Math.floor(Math.random()*999999);

let segments = [];

let timeOfDay = 0.32;
// 0 = 午夜
// .25 = 日出
// .5 = 中午
// .75 = 黃昏
// 1 = 午夜

let dayLength = 420;

const statusEl = document.getElementById("status");
const infoEl = document.getElementById("info");
const worldNameEl = document.getElementById("worldName");

const startBtn = document.getElementById("start");
const simulateBtn = document.getElementById("simulate");


////////////////////////////////////////////////////////////
// Random
////////////////////////////////////////////////////////////

function random(){
  let x = Math.sin(worldSeed++) * 43758.5453123;
  return x - Math.floor(x);
}

function randomRange(a,b){
  return a + random()*(b-a);
}

function randomInt(a,b){
  return Math.floor(randomRange(a,b+1));
}


////////////////////////////////////////////////////////////
// 顏色 / 日夜系統
////////////////////////////////////////////////////////////

const daySky = new THREE.Color(0x8fd5ee);
const sunsetSky = new THREE.Color(0xf19a70);
const nightSky = new THREE.Color(0x07132d);

const dayFog = new THREE.Color(0x8fc6d6);
const nightFog = new THREE.Color(0x10182d);

function smoothStep(a,b,t){
  t=Math.max(0,Math.min(1,t));
  return t*t*(3-2*t);
}

function getDayFactor(){

  let t=timeOfDay;

  // 白天
  if(t>=.30 && t<=.70){
    return 1;
  }

  // 日出
  if(t<.30){
    return smoothStep(0,.30,t);
  }

  // 黃昏
  return smoothStep(.70,1,1-t);
}

function updateLighting(dt){

  timeOfDay += dt/dayLength;

  if(timeOfDay>1){
    timeOfDay-=1;
  }

  let sunAmount=getDayFactor();

  let sky=new THREE.Color();

  if(timeOfDay<.25){

    let p=timeOfDay/.25;

    sky.copy(nightSky).lerp(sunsetSky,p);

  }else if(timeOfDay<.5){

    let p=(timeOfDay-.25)/.25;

    sky.copy(sunsetSky).lerp(daySky,p);

  }else if(timeOfDay<.75){

    let p=(timeOfDay-.5)/.25;

    sky.copy(daySky).lerp(sunsetSky,p);

  }else{

    let p=(timeOfDay-.75)/.25;

    sky.copy(sunsetSky).lerp(nightSky,p);
  }

  scene.background.copy(sky);

  scene.fog.color.copy(
    nightFog.clone().lerp(dayFog,sunAmount)
  );

  sunLight.intensity=.25+sunAmount*2.3;
  hemiLight.intensity=.3+sunAmount*1.8;

  // 太陽
  let angle=timeOfDay*Math.PI*2;

  sun.position.set(
    Math.cos(angle)*80,
    Math.sin(angle)*80,
    -100
  );

  sun.visible=sunAmount>.05;

  // 月亮
  moon.position.set(
    -Math.cos(angle)*70,
    -Math.sin(angle)*70+35,
    -100
  );

  moon.visible=sunAmount<.65;

  // 星星
  stars.visible=sunAmount<.45;

  // HUD
  let phase="🌙 夜晚";

  if(timeOfDay>=.22 && timeOfDay<.32)
    phase="🌅 黎明";

  else if(timeOfDay>=.32 && timeOfDay<.68)
    phase="☀️ 白天";

  else if(timeOfDay>=.68 && timeOfDay<.78)
    phase="🌇 黃昏";

  worldNameEl.textContent =
    `${phase} · 世界種子 ${worldSeed%100000}`;
}


////////////////////////////////////////////////////////////
// Three.js
////////////////////////////////////////////////////////////

let sunLight;
let hemiLight;
let sun;
let moon;
let stars;

function init3D(){

  scene=new THREE.Scene();

  scene.background=daySky.clone();

  scene.fog=new THREE.Fog(
    dayFog.clone(),
    35,
    180
  );


  camera=new THREE.PerspectiveCamera(
    70,
    innerWidth/innerHeight,
    .1,
    400
  );

  camera.position.set(
    0,
    2.0,
    7
  );


  renderer=new THREE.WebGLRenderer({
    antialias:true,
    powerPreference:"high-performance"
  });

  renderer.setPixelRatio(
    Math.min(devicePixelRatio,1.5)
  );

  renderer.setSize(
    innerWidth,
    innerHeight
  );

  renderer.outputColorSpace=THREE.SRGBColorSpace;

  document.body.appendChild(
    renderer.domElement
  );


  ////////////////////////////////////////////////////////////
  // 光
  ////////////////////////////////////////////////////////////

  hemiLight=new THREE.HemisphereLight(
    0xffffff,
    0x334455,
    2
  );

  scene.add(hemiLight);


  sunLight=new THREE.DirectionalLight(
    0xfff1c4,
    2
  );

  sunLight.position.set(
    50,
    80,
    -100
  );

  scene.add(sunLight);


  ////////////////////////////////////////////////////////////
  // 太陽
  ////////////////////////////////////////////////////////////

  sun=new THREE.Mesh(
    new THREE.SphereGeometry(6,24,24),
    new THREE.MeshBasicMaterial({
      color:0xffdf72
    })
  );

  sun.position.set(
    60,
    70,
    -100
  );

  scene.add(sun);


  ////////////////////////////////////////////////////////////
  // 月亮
  ////////////////////////////////////////////////////////////

  moon=new THREE.Mesh(
    new THREE.SphereGeometry(4,24,24),
    new THREE.MeshBasicMaterial({
      color:0xeaf1ff
    })
  );

  moon.position.set(
    -50,
    50,
    -100
  );

  scene.add(moon);


  ////////////////////////////////////////////////////////////
  // 星空
  ////////////////////////////////////////////////////////////

  stars=createStars();

  scene.add(stars);


  ////////////////////////////////////////////////////////////
  // 世界
  ////////////////////////////////////////////////////////////

  createWorld();


  clock=new THREE.Clock();

  animate();
}


////////////////////////////////////////////////////////////
// 星空
////////////////////////////////////////////////////////////

function createStars(){

  const group=new THREE.Group();

  const geometry=new THREE.SphereGeometry(
    .15,
    5,
    5
  );

  const material=new THREE.MeshBasicMaterial({
    color:0xffffff
  });

  for(let i=0;i<180;i++){

    const star=new THREE.Mesh(
      geometry,
      material
    );

    star.position.set(
      randomRange(-120,120),
      randomRange(25,100),
      randomRange(-180,20)
    );

    star.scale.setScalar(
      randomRange(.3,1.6)
    );

    group.add(star);
  }

  return group;
}


////////////////////////////////////////////////////////////
// 世界 Segment
////////////////////////////////////////////////////////////

function createWorld(){

  const segmentLength=35;

  for(let i=0;i<30;i++){

    const g=createSegment(
      i,
      -i*segmentLength-10
    );

    scene.add(g);
    segments.push(g);
  }
}


////////////////////////////////////////////////////////////
// 每一段世界
////////////////////////////////////////////////////////////

function createSegment(index,z){

  const g=new THREE.Group();

  g.position.z=z;

  ////////////////////////////////////////////////////////////
  // 草地
  ////////////////////////////////////////////////////////////

  const groundMat=new THREE.MeshLambertMaterial({
    color:0x5d914d
  });

  const ground=new THREE.Mesh(
    new THREE.BoxGeometry(
      100,
      .4,
      35
    ),
    groundMat
  );

  ground.position.y=-.2;

  g.add(ground);


  ////////////////////////////////////////////////////////////
  // 小路
  ////////////////////////////////////////////////////////////

  const pathMat=new THREE.MeshLambertMaterial({
    color:0xb9a078
  });

  const path=new THREE.Mesh(
    new THREE.PlaneGeometry(
      6,
      35
    ),
    pathMat
  );

  path.rotation.x=-Math.PI/2;
  path.position.y=.015;

  g.add(path);


  ////////////////////////////////////////////////////////////
  // 遠山
  ////////////////////////////////////////////////////////////

  if(index%3!==1){

    for(let i=0;i<3;i++){

      const mountain=new THREE.Mesh(
        new THREE.ConeGeometry(
          randomRange(14,24),
          randomRange(28,50),
          7
        ),
        new THREE.MeshLambertMaterial({
          color:random()<.5
            ?0x527b70
            :0x46665e
        })
      );

      mountain.position.set(
        i===0
          ? randomRange(-60,-30)
          : randomRange(30,60),

        randomRange(12,22),

        randomRange(-10,10)
      );

      g.add(mountain);
    }
  }


  ////////////////////////////////////////////////////////////
  // 樹
  ////////////////////////////////////////////////////////////

  const treeCount=randomInt(3,8);

  for(let i=0;i<treeCount;i++){

    const side=random()<.5?-1:1;

    addTree(
      g,
      side*randomRange(7,17),
      randomRange(-15,15),
      randomRange(.7,1.5)
    );
  }


  ////////////////////////////////////////////////////////////
  // 花
  ////////////////////////////////////////////////////////////

  for(let i=0;i<randomInt(3,10);i++){

    addFlower(
      g,
      randomRange(-12,12),
      randomRange(-16,16)
    );
  }


  ////////////////////////////////////////////////////////////
  // 世界事件
  ////////////////////////////////////////////////////////////

  const event=random();

  if(event<.20){

    // 村莊
    createVillage(g);

  }else if(event<.34){

    // 河流＋橋
    createRiverBridge(g);

  }else if(event<.43){

    // 城堡
    createCastleScene(g);

  }else if(event<.52){

    // 大型森林
    createAncientForest(g);

  }

  return g;
}


////////////////////////////////////////////////////////////
// 樹
////////////////////////////////////////////////////////////

function addTree(parent,x,z,s){

  const g=new THREE.Group();

  const trunk=new THREE.Mesh(
    new THREE.CylinderGeometry(
      .18*s,
      .28*s,
      2.4*s,
      7
    ),
    new THREE.MeshLambertMaterial({
      color:0x68472d
    })
  );

  trunk.position.y=1.2*s;

  g.add(trunk);


  for(let i=0;i<3;i++){

    const crown=new THREE.Mesh(
      new THREE.ConeGeometry(
        (1.5-i*.25)*s,
        2.8*s,
        8
      ),
      new THREE.MeshLambertMaterial({
        color:
          i===2
          ?0x39743f
          :0x2d6938
      })
    );

    crown.position.y=
      (2+i*.75)*s;

    g.add(crown);
  }

  g.position.set(x,0,z);

  parent.add(g);
}


////////////////////////////////////////////////////////////
// 花
////////////////////////////////////////////////////////////

function addFlower(parent,x,z){

  const stem=new THREE.Mesh(
    new THREE.CylinderGeometry(
      .025,
      .025,
      .35,
      5
    ),
    new THREE.MeshLambertMaterial({
      color:0x4f813e
    })
  );

  stem.position.set(
    x,
    .18,
    z
  );

  parent.add(stem);


  const flower=new THREE.Mesh(
    new THREE.SphereGeometry(
      .12,
      6,
      6
    ),
    new THREE.MeshLambertMaterial({
      color:
        random()<.5
        ?0xf4d35e
        :0xff8fa3
    })
  );

  flower.position.set(
    x,
    .4,
    z
  );

  parent.add(flower);
}


////////////////////////////////////////////////////////////
// 房子
////////////////////////////////////////////////////////////

function addHouse(parent,x,z,s=1){

  const g=new THREE.Group();

  const body=new THREE.Mesh(
    new THREE.BoxGeometry(
      3.8*s,
      2.6*s,
      3.6*s
    ),
    new THREE.MeshLambertMaterial({
      color:
        random()<.5
        ?0xe5d2ae
        :0xd9c1a0
    })
  );

  body.position.y=1.3*s;

  g.add(body);


  const roof=new THREE.Mesh(
    new THREE.ConeGeometry(
      3*s,
      1.9*s,
      4
    ),
    new THREE.MeshLambertMaterial({
      color:
        random()<.5
        ?0x874b42
        :0x654c50
    })
  );

  roof.rotation.y=Math.PI/4;
  roof.position.y=3.4*s;

  g.add(roof);


  // 門
  const door=new THREE.Mesh(
    new THREE.BoxGeometry(
      .55*s,
      1.1*s,
      .08*s
    ),
    new THREE.MeshLambertMaterial({
      color:0x573b2c
    })
  );

  door.position.set(
    0,
    .55*s,
    1.84*s
  );

  g.add(door);


  // 窗戶
  for(const xx of [-1,1]){

    const window=new THREE.Mesh(
      new THREE.BoxGeometry(
        .55*s,
        .55*s,
        .08*s
      ),
      new THREE.MeshBasicMaterial({
        color:0xffd76e
      })
    );

    window.position.set(
      xx*s,
      1.45*s,
      1.84*s
    );

    g.add(window);
  }


  g.position.set(
    x,
    0,
    z
  );

  g.rotation.y=randomRange(-.2,.2);

  parent.add(g);
}


////////////////////////////////////////////////////////////
// 村莊
////////////////////////////////////////////////////////////

function createVillage(parent){

  for(let i=0;i<5;i++){

    const side=i%2===0?-1:1;

    addHouse(
      parent,
      side*randomRange(8,13),
      randomRange(-13,13),
      randomRange(.8,1.2)
    );
  }


  // 村莊中央小廣場
  const square=new THREE.Mesh(
    new THREE.CircleGeometry(3,16),
    new THREE.MeshLambertMaterial({
      color:0x9c8d70
    })
  );

  square.rotation.x=-Math.PI/2;
  square.position.y=.025;

  parent.add(square);
}


////////////////////////////////////////////////////////////
// 河流 + 橋
////////////////////////////////////////////////////////////

function createRiverBridge(parent){

  ////////////////////////////////////////////////////////////
  // 河
  ////////////////////////////////////////////////////////////

  const river=new THREE.Mesh(
    new THREE.PlaneGeometry(
      32,
      8
    ),
    new THREE.MeshPhongMaterial({
      color:0x398fc1,
      transparent:true,
      opacity:.82,
      shininess:120
    })
  );

  river.rotation.x=-Math.PI/2;

  river.position.set(
    0,
    .05,
    0
  );

  parent.add(river);


  ////////////////////////////////////////////////////////////
  // 河岸
  ////////////////////////////////////////////////////////////

  for(const side of [-1,1]){

    const bank=new THREE.Mesh(
      new THREE.BoxGeometry(
        32,
        .3,
        3
      ),
      new THREE.MeshLambertMaterial({
        color:0x6e8c55
      })
    );

    bank.position.set(
      0,
      .05,
      side*5.2
    );

    parent.add(bank);
  }


  ////////////////////////////////////////////////////////////
  // 橋
  ////////////////////////////////////////////////////////////

  const bridge=new THREE.Group();

  const bridgeDeck=new THREE.Mesh(
    new THREE.BoxGeometry(
      6,
      .5,
      11
    ),
    new THREE.MeshLambertMaterial({
      color:0x8a6950
    })
  );

  bridgeDeck.position.y=.5;

  bridge.add(bridgeDeck);


  // 石柱
  for(const x of [-2.5,2.5]){

    for(const z of [-4,4]){

      const pillar=new THREE.Mesh(
        new THREE.CylinderGeometry(
          .28,
          .38,
          1.8,
          8
        ),
        new THREE.MeshLambertMaterial({
          color:0x8d8b82
        })
      );

      pillar.position.set(
        x,
        1.0,
        z
      );

      bridge.add(pillar);
    }
  }


  // 欄杆
  for(const side of [-1,1]){

    for(let i=-4;i<=4;i+=1.5){

      const post=new THREE.Mesh(
        new THREE.CylinderGeometry(
          .08,
          .08,
          .9,
          6
        ),
        new THREE.MeshLambertMaterial({
          color:0x665144
        })
      );

      post.position.set(
        side*2.5,
        1,
        i
      );

      bridge.add(post);
    }
  }

  bridge.position.y=.1;

  parent.add(bridge);
}


////////////////////////////////////////////////////////////
// 城堡
////////////////////////////////////////////////////////////

  const castle=new THREE.Group();

  const stoneMat=
    new THREE.MeshLambertMaterial({
      color:0x99999a
    });


  // 主城牆
  const wall=new THREE.Mesh(
    new THREE.BoxGeometry(
      18,
      7,
      7
    ),
    stoneMat
  );

  wall.position.y=3.5;

  castle.add(wall);


  // 城門
  const gate=new THREE.Mesh(
    new THREE.BoxGeometry(
      4,
      4.5,
      .8
    ),
    new THREE.MeshLambertMaterial({
      color:0x40373b
    })
  );

  gate.position.set(
    0,
    2.2,
    3.8
  );

  castle.add(gate);


  ////////////////////////////////////////////////////////////
  // 高塔
  ////////////////////////////////////////////////////////////

  for(const x of [-8,8]){

    const tower=new THREE.Mesh(
      new THREE.CylinderGeometry(
        2,
        2,
        12,
        10
      ),
      stoneMat
    );

    tower.position.set(
      x,
      6,
      0
    );

    castle.add(tower);


    const roof=new THREE.Mesh(
      new THREE.ConeGeometry(
        2.7,
        4,
        8
      ),
      new THREE.MeshLambertMaterial({
        color:0x514b59
      })
    );

    roof.position.set(
      x,
      14,
      0
    );

    castle.add(roof);
  }


  ////////////////////////////////////////////////////////////
  // 城旗
  ////////////////////////////////////////////////////////////

  const pole=new THREE.Mesh(
    new THREE.CylinderGeometry(
      .06,
      .06,
      5,
      5
    ),
    new THREE.MeshLambertMaterial({
      color:0x4d3b2c
    })
  );

  pole.position.set(
    0,
    10,
    0
  );

  castle.add(pole);


  const flag=new THREE.Mesh(
    new THREE.PlaneGeometry(
      2.5,
      1.3
    ),
    new THREE.MeshBasicMaterial({
      color:0xb7354b,
      side:THREE.DoubleSide
    })
  );

  flag.position.set(
    1.2,
    11.7,
    0
  );

  castle.add(flag);


  castle.position.set(
    0,
    0,
    -2
  );

  parent.add(castle);
}


////////////////////////////////////////////////////////////
// 古老森林
////////////////////////////////////////////////////////////

function createAncientForest(parent){

  for(let i=0;i<14;i++){

    const side=random()<.5?-1:1;

    addTree(
      parent,
      side*randomRange(7,22),
      randomRange(-17,17),
      randomRange(1.2,2.4)
    );
  }
}


////////////////////////////////////////////////////////////
// 動作感測
////////////////////////////////////////////////////////////

function detectStepFromMotion(e){

  const a=e.accelerationIncludingGravity;

  if(!a)return;

  const mag=Math.sqrt(
    (a.x||0)**2+
    (a.y||0)**2+
    (a.z||0)**2
  );

  const now=performance.now();

  if(
    mag>13 &&
    now-lastStep>280
  ){

    lastStep=now;

    registerStep(now);
  }
}


function registerStep(now){

  steps++;

  stepTimes.push(now);

  stepTimes=
    stepTimes.filter(
      t=>now-t<5000
    );


  if(stepTimes.length>=2){

    const intervals=[];

    for(
      let i=1;
      i<stepTimes.length;
      i++
    ){

      intervals.push(
        stepTimes[i]-
        stepTimes[i-1]
      );
    }


    const avg=
      intervals.reduce(
        (a,b)=>a+b,
        0
      )/intervals.length;


    const spm=Math.max(
      0,
      Math.min(
        160,
        60000/avg
      )
    );


    targetSpeed=
      Math.max(
        0,
        Math.min(
          7,
          spm/23
        )
      );
  }


  moving=true;

  statusEl.textContent=
    "🚶 正在散步";
}


////////////////////////////////////////////////////////////
// 模擬散步
////////////////////////////////////////////////////////////

simulateBtn.addEventListener(
  "click",
  ()=>{

    moving=true;

    lastStep=
      performance.now();

    registerStep(
      performance.now()
    );
  }
);


////////////////////////////////////////////////////////////
// 啟動
////////////////////////////////////////////////////////////

async function start(){

  startBtn.style.display="none";

  if(
    typeof DeviceMotionEvent!=="undefined" &&
    typeof DeviceMotionEvent.requestPermission==="function"
  ){

    try{

      const p=
        await DeviceMotionEvent.requestPermission();

      if(p!=="granted")
        throw new Error(
          "permission denied"
        );

    }catch(err){

      statusEl.textContent=
        "感測器未開啟，可使用右下角模擬散步";
    }
  }


  window.addEventListener(
    "devicemotion",
    detectStepFromMotion,
    {
      passive:true
    }
  );


  motionReady=true;

  statusEl.textContent=
    "👟 請開始踏步";
}


////////////////////////////////////////////////////////////
// 更新世界
////////////////////////////////////////////////////////////

function updateWorld(dt){

  ////////////////////////////////////////////////////////////
  // 沒有走路 → 減速
  ////////////////////////////////////////////////////////////

  if(
    performance.now()-lastStep>1200
  ){

    targetSpeed=0;

    if(motionReady){

      statusEl.textContent=
        "⏸️ 等待下一步…";
    }
  }


  speed +=
    (targetSpeed-speed)*
    Math.min(
      1,
      dt*4
    );


  distance +=
    speed*dt;


  ////////////////////////////////////////////////////////////
  // 世界向玩家移動
  ////////////////////////////////////////////////////////////

  for(const segment of segments){

    segment.position.z +=
      speed*dt;


    //////////////////////////////////////////////////////////
    // 到身後 → 放回遠方
    //////////////////////////////////////////////////////////

    if(segment.position.z>25){

      let minZ=0;

      for(const s of segments){

        if(s.position.z<minZ)
          minZ=s.position.z;
      }


      segment.position.z=
        minZ-35;


      ////////////////////////////////////////////////////////
      // 換一個新的世界事件
      ////////////////////////////////////////////////////////

      regenerateSegment(segment);
    }
  }
}


////////////////////////////////////////////////////////////
// 隨機重新生成
////////////////////////////////////////////////////////////

function regenerateSegment(segment){

  // 清除舊內容
  while(segment.children.length>0){

    const child=
      segment.children[
        segment.children.length-1
      ];

    segment.remove(child);

    child.traverse(obj=>{

      if(obj.geometry)
        obj.geometry.dispose();

      if(obj.material){

        if(Array.isArray(obj.material)){

          obj.material.forEach(
            m=>m.dispose()
          );

        }else{

          obj.material.dispose();
        }
      }
    });
  }


  // 重新建立
  createSegmentContent(segment);
}


////////////////////////////////////////////////////////////
// 重新生成內容
////////////////////////////////////////////////////////////

function createSegmentContent(g){

  ////////////////////////////////////////////////////////////
  // 地面
  ////////////////////////////////////////////////////////////

  const ground=new THREE.Mesh(
    new THREE.BoxGeometry(
      100,
      .4,
      35
    ),
    new THREE.MeshLambertMaterial({
      color:
        random()<.5
        ?0x5d914d
        :0x648f52
    })
  );

  ground.position.y=-.2;

  g.add(ground);


  ////////////////////////////////////////////////////////////
  // 道路
  ////////////////////////////////////////////////////////////

  const path=new THREE.Mesh(
    new THREE.PlaneGeometry(
      6,
      35
    ),
    new THREE.MeshLambertMaterial({
      color:0xb9a078
    })
  );

  path.rotation.x=-Math.PI/2;

  path.position.y=.015;

  g.add(path);


  ////////////////////////////////////////////////////////////
  // 樹
  ////////////////////////////////////////////////////////////

  for(
    let i=0;
    i<randomInt(3,8);
    i++
  ){

    const side=
      random()<.5
      ?-1
      :1;

    addTree(
      g,
      side*randomRange(7,18),
      randomRange(-16,16),
      randomRange(.7,1.6)
    );
  }


  ////////////////////////////////////////////////////////////
  // 花
  ////////////////////////////////////////////////////////////

  for(
    let i=0;
    i<randomInt(2,8);
    i++
  ){

    addFlower(
      g,
      randomRange(-13,13),
      randomRange(-16,16)
    );
  }


  ////////////////////////////////////////////////////////////
  // 隨機事件
  ////////////////////////////////////////////////////////////

  const r=random();


  if(r<.18){

    createVillage(g);

  }else if(r<.30){

    createRiverBridge(g);

  }else if(r<.40){

    createCastleScene(g);

  }else if(r<.48){

    createAncientForest(g);
  }
}


////////////////////////////////////////////////////////////
// 動畫
////////////////////////////////////////////////////////////

function animate(){

  requestAnimationFrame(
    animate
  );


  const dt=
    Math.min(
      clock.getDelta(),
      .05
    );


  updateLighting(dt);

  updateWorld(dt);


  ////////////////////////////////////////////////////////////
  // 手機輕微晃動
  ////////////////////////////////////////////////////////////

  const walkBounce=
    Math.sin(
      performance.now()*.012
    )*
    Math.min(
      speed*.012,
      .035
    );


  camera.position.y=
    2+
    walkBounce;


  camera.rotation.z=
    Math.sin(
      performance.now()*.004
    )*
    Math.min(
      speed*.002,
      .012
    );


  ////////////////////////////////////////////////////////////
  // HUD
  ////////////////////////////////////////////////////////////

  infoEl.textContent=
    `步頻：${Math.round(currentSPM())} 步/分　`+
    `速度：${speed.toFixed(1)}　`+
    `距離：${distance.toFixed(0)} m`;


  renderer.render(
    scene,
    camera
  );
}


////////////////////////////////////////////////////////////
// 步頻
////////////////////////////////////////////////////////////

function currentSPM(){

  if(stepTimes.length<2)
    return 0;


  const now=
    performance.now();


  const arr=
    stepTimes.filter(
      t=>now-t<5000
    );


  if(arr.length<2)
    return 0;


  const intervals=[];


  for(
    let i=1;
    i<arr.length;
    i++
  ){

    intervals.push(
      arr[i]-arr[i-1]
    );
  }


  return 60000/
    (
      intervals.reduce(
        (a,b)=>a+b,
        0
      )/
      intervals.length
    );
}


////////////////////////////////////////////////////////////
// Resize
////////////////////////////////////////////////////////////

window.addEventListener(
  "resize",
  ()=>{

    if(!camera||!renderer)
      return;


    camera.aspect=
      innerWidth/
      innerHeight;


    camera.updateProjectionMatrix();


    renderer.setSize(
      innerWidth,
      innerHeight
    );
  }
);


////////////////////////////////////////////////////////////
// Start
////////////////////////////////////////////////////////////

startBtn.addEventListener(
  "click",
  start
);


////////////////////////////////////////////////////////////
// 啟動 3D
////////////////////////////////////////////////////////////

init3D();

</script>
